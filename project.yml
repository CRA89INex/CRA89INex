name: Punkt
options:
  bundleIdPrefix: de.cyberriskadvisor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  IntentionCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "" # fill in your Team ID
    CODE_SIGN_STYLE: Automatic

targets:
  Punkt:
    type: application
    platform: iOS
    sources:
      - path: App/Punkt
    dependencies:
      - package: IntentionCore
      - target: PunktWidgetExtension
        embed: true
    entitlements:
      path: App/Punkt/Resources/Punkt.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.cyberriskadvisor.punkt
    info:
      path: App/Punkt/Resources/Info.plist
      properties:
        CFBundleDisplayName: Punkt
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSpeechRecognitionUsageDescription: "Damit du deine Intention auch im Gehen diktieren kannst."
        NSMicrophoneUsageDescription: "Wird fürs Diktieren deiner Intention verwendet."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cyberriskadvisor.punkt
        GENERATE_INFOPLIST_FILE: false

  PunktWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/PunktWidget
    dependencies:
      - package: IntentionCore
    entitlements:
      path: Widget/PunktWidget/PunktWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.cyberriskadvisor.punkt
    info:
      path: Widget/PunktWidget/Info.plist
      properties:
        CFBundleDisplayName: Punkt Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cyberriskadvisor.punkt.widget
        GENERATE_INFOPLIST_FILE: false

schemes:
  Punkt:
    build:
      targets:
        Punkt: all
        PunktWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IntentionCoreTests
