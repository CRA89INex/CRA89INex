name: Punkt
options:
  bundleIdPrefix: de.cyberriskadvisor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "" # fill in your Team ID
    CODE_SIGN_STYLE: Automatic

targets:
  IntentionCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/IntentionCore
    info:
      path: Sources/IntentionCore/Resources/Info.plist
      properties: {}
    settings:
      base:
        # Shared by both the app and the widget extension — built static so
        # neither target needs to embed it, avoiding the classic "multiple
        # commands produce ...framework" duplicate-embed error you get when
        # an app and its extension both embed the same dynamic framework.
        MACH_O_TYPE: staticlib
        GENERATE_INFOPLIST_FILE: "NO"

  IntentionCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/IntentionCoreTests
    dependencies:
      - target: IntentionCore
    info:
      path: Tests/IntentionCoreTests/Resources/Info.plist
      properties: {}
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "NO"

  Punkt:
    type: application
    platform: iOS
    sources:
      - path: App/Punkt
    dependencies:
      - target: IntentionCore
      - target: PunktWidgetExtension
        embed: true
    entitlements:
      path: App/Punkt/Resources/Punkt.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.cyberriskadvisor.punkt
    info:
      path: App/Punkt/Resources/Info.plist
      properties:
        CFBundleDisplayName: Punkt
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSpeechRecognitionUsageDescription: "Damit du deine Intention auch im Gehen diktieren kannst."
        NSMicrophoneUsageDescription: "Wird fürs Diktieren deiner Intention verwendet."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cyberriskadvisor.punkt
        GENERATE_INFOPLIST_FILE: "NO"

  PunktWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/PunktWidget
    dependencies:
      - target: IntentionCore
    entitlements:
      path: Widget/PunktWidget/PunktWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.cyberriskadvisor.punkt
    info:
      path: Widget/PunktWidget/Info.plist
      properties:
        CFBundleDisplayName: Punkt Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cyberriskadvisor.punkt.widget
        GENERATE_INFOPLIST_FILE: "NO"

schemes:
  Punkt:
    build:
      targets:
        IntentionCore: all
        Punkt: all
        PunktWidgetExtension: all
        IntentionCoreTests: [test]
    run:
      config: Debug
      executable: Punkt
    test:
      config: Debug
      targets:
        - IntentionCoreTests
